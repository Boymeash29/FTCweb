name: Publish scheduled content

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish due entries
        env:
          PUBLISH_JOB_URL: ${{ vars.PUBLISH_JOB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$PUBLISH_JOB_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PUBLISH_JOB_URL/api/cron/publish"
